name: Build

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main

jobs:
  ant-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant

      - name: Compile and package
        run: ant clean jar

      - name: Install pinned Android tools
        run: bash scripts/update-tools.sh dist/lib

      - name: Verify packaged toolchain
        run: |
          test -f dist/ObfuscateMe.jar
          test -f dist/lib/apktool.jar
          test -f dist/lib/uber-apk-signer.jar
          java -jar dist/lib/apktool.jar --version
          java -jar dist/lib/uber-apk-signer.jar --version

      - name: Add documentation to package
        run: |
          cp README.md dist/README.md
          cp "How to use.txt" dist/"How to use.txt"
          cp LICENSE dist/LICENSE

      - name: Upload runnable package
        uses: actions/upload-artifact@v4
        with:
          name: ObfuscateMe-java21
          path: dist/
          if-no-files-found: error

      - name: Install Android 14 SDK components
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK root: $SDK_ROOT"

          if [[ -f "$SDK_ROOT/platforms/android-34/android.jar"              && -x "$SDK_ROOT/build-tools/34.0.0/aapt2"              && -x "$SDK_ROOT/build-tools/34.0.0/d8" ]]; then
            echo "Android 14 SDK components are already installed."
            exit 0
          fi

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "sdkmanager was not found under $SDK_ROOT/cmdline-tools" >&2
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-34" "build-tools;34.0.0"

      - name: Android 14 APK round-trip test
        run: bash scripts/test-android14.sh

      - name: Upload Android 14 integration APKs
        uses: actions/upload-artifact@v4
        with:
          name: android14-integration-apks
          path: |
            build/android14-integration/signed-original/*.apk
            build/android14-integration/signed-rebuilt/*.apk
          if-no-files-found: error
