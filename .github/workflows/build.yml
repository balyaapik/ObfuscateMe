name: Build

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main

jobs:
  ant-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant

      - name: Compile and package
        run: ant clean jar

      - name: Install pinned Android tools
        run: bash scripts/update-tools.sh dist/lib

      - name: Verify packaged toolchain
        run: |
          test -f dist/ObfuscateMe.jar
          test -f dist/lib/apktool.jar
          test -f dist/lib/uber-apk-signer.jar
          java -jar dist/lib/apktool.jar --version
          java -jar dist/lib/uber-apk-signer.jar --version

      - name: Add documentation to package
        run: |
          cp README.md dist/README.md
          cp "How to use.txt" dist/"How to use.txt"
          cp LICENSE dist/LICENSE

      - name: Upload runnable package
        uses: actions/upload-artifact@v4
        with:
          name: ObfuscateMe-java21
          path: dist/
          if-no-files-found: error

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Install Android 14 SDK components
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Android 14 APK round-trip test
        run: bash scripts/test-android14.sh

      - name: Upload Android 14 integration APKs
        uses: actions/upload-artifact@v4
        with:
          name: android14-integration-apks
          path: |
            build/android14-integration/signed-original/*.apk
            build/android14-integration/signed-rebuilt/*.apk
          if-no-files-found: error
